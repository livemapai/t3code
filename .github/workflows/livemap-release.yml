name: Livemap release

# Publishes every push to `livemap` as the repository's latest GitHub Release: the signed
# macOS arm64 app, the Linux x64 app, and both CLI archives. Desktop updates, `t3 update`
# and the install scripts all read that release. Packaging reuses upstream's
# release-desktop.yml; see livemap/README.md.

on:
  push:
    branches: [livemap]
  workflow_dispatch:

concurrency:
  group: livemap-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    if: github.repository == 'livemapai/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    steps:
      # An unsigned macOS build published as latest could never update itself.
      - name: Require macOS signing secrets
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!name}" ]] || { echo "Repository secret $name is missing." >&2; exit 1; }
          done

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: /.env.example
          sparse-checkout-cone-mode: false

      # Same scheme as livemap/deploy-vanessa.sh: one patch above upstream's newest stable
      # tag, so every build outranks the upstream release it is based on. The fork carries
      # no tags, so they come from upstream. A prerelease suffix of plain numbers keeps
      # every version valid semver, which electron-updater requires.
      - id: version
        name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags https://github.com/pingdotgg/t3code.git '+refs/tags/v*:refs/tags/v*'
          base=$(git tag --merged HEAD --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 |
            awk -F. '{ sub(/^v/, "", $1); print $1 "." $2 "." $3 + 1 }')
          version="${base:?no upstream stable tag is reachable from HEAD}-livemap.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # The public T3 Connect identifiers official builds bake in.
      - id: public_config
        name: Read T3 Connect public config
        shell: bash
        run: |
          set -euo pipefail
          read_env() { sed -n "s/^$1=//p" .env.example | head -n 1; }
          {
            echo "clerk_publishable_key=$(read_env T3CODE_CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(read_env T3CODE_CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(read_env T3CODE_CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(read_env T3CODE_RELAY_URL)"
          } >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.version.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.version.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.version.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.version.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [version, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.version.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.version.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.version.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.version.outputs.relay_url }}
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [version, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.version.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.version.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.version.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.version.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  release:
    name: Publish GitHub Release
    needs: [version, desktop_mac_arm64, desktop_linux_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Installers verify archives against this file, so it is written from the uploaded bytes.
      - name: Write CLI archive checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # --latest is what electron-updater and `t3 update` follow.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob extglob
          files=(release-assets/*.{dmg,zip,AppImage,deb,blockmap,tar.gz} release-assets/!(builder-debug).yml release-assets/SHA256SUMS)
          gh release create "v$VERSION" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Code (Livemap) $VERSION" \
            --generate-notes \
            --latest
